name: Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      version: ${{ steps.registry.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check whether this version is already on PyPI
        id: registry
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import time
          import tomllib
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import urlopen

          with Path("pyproject.toml").open("rb") as pyproject_file:
              project = tomllib.load(pyproject_file)["project"]

          package_name = project["name"]
          package_version = project["version"]
          registry_url = (
              "https://pypi.org/pypi/"
              f"{quote(package_name, safe='')}/{quote(package_version, safe='')}/json"
          )
          try:
              with urlopen(registry_url, timeout=30):
                  already_published = True
          except HTTPError as error:
              if error.code != 404:
                  raise
              already_published = False

          if not already_published:
              with Path("src/onramp/config.toml").open("rb") as config_file:
                  frontend_version = tomllib.load(config_file)["onramp_js_version"]
              frontend_url = (
                  "https://registry.npmjs.org/"
                  f"onramp-js/{quote(frontend_version, safe='')}"
              )
              for attempt in range(1, 121):
                  try:
                      with urlopen(frontend_url, timeout=30):
                          break
                  except HTTPError as error:
                      if error.code != 404:
                          raise
                      if attempt == 120:
                          raise RuntimeError(
                              "Cannot publish OnRamp before matching frontend "
                              f"onramp-js@{frontend_version} is available on npm."
                          ) from error
                      print(
                          f"Waiting for npm to process onramp-js@{frontend_version} "
                          f"({attempt}/120)..."
                      )
                      time.sleep(5)
              print(f"Required frontend onramp-js@{frontend_version} is published.")

          status = "is already published" if already_published else "is new and will be published"
          print(f"{package_name}=={package_version} {status}.")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as github_output:
              github_output.write(f"version={package_version}\n")
              github_output.write(f"publish={str(not already_published).lower()}\n")
          PYTHON

  build:
    needs: check_version
    if: needs.check_version.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test release dependencies
        run: |
          python -m pip install --upgrade --editable ".[dev]"
          python -m pip check
          python -m pytest

      - name: Build package distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Store package distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [check_version, build]
    if: needs.check_version.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    needs: [check_version, publish]
    if: >-
      always() &&
      needs.check_version.result == 'success' &&
      (
        (needs.check_version.outputs.publish == 'true' && needs.publish.result == 'success') ||
        (needs.check_version.outputs.publish == 'false' && needs.publish.result == 'skipped')
      )
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Wait for the version to become installable
        env:
          PACKAGE_VERSION: ${{ needs.check_version.outputs.version }}
        run: |
          for attempt in $(seq 1 120); do
            if python -m pip install \
              --upgrade \
              --no-cache-dir \
              --index-url https://pypi.org/simple \
              "onramp==${PACKAGE_VERSION}"; then
              python -m pip check
              exit 0
            fi
            echo "Waiting for onramp==${PACKAGE_VERSION} on PyPI (${attempt}/120)..."
            sleep 5
          done
          echo "onramp==${PACKAGE_VERSION} is not installable after 10 minutes." >&2
          exit 1

      - name: Test a scaffold from the public PyPI package
        run: |
          app_dir="${RUNNER_TEMP}/onramp-public-smoke"
          cd "${RUNNER_TEMP}"
          onramp new onramp-public-smoke
          cd "${app_dir}/build"
          npm audit
          npm test
          npm run typecheck
          npm run build:web
