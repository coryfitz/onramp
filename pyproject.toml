[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onramp"
version = "0.5.28"
description = "A full-stack Python framework for building web, iOS, and Android apps with React Native"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Cory Fitz" },
]
keywords = [
    "app-framework",
    "full-stack",
    "react-native",
    "web",
    "wora",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "asyncpg>=0.30.0,<1",
    "asyncmy>=0.2.10,<1",
    "starlette>=0.47.3,<2",
    "tortoise-orm>=1.1.8,<2",
    "uvicorn>=0.35.0",
    "watchfiles>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1",
    "httpx2>=2.12.0,<3",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
onramp = "onramp.cli:main"

[project.urls]
Homepage = "https://github.com/coryfitz/onramp"
Repository = "https://github.com/coryfitz/onramp"
Issues = "https://github.com/coryfitz/onramp/issues"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

# include config.toml, static assets, and Python app templates
[tool.setuptools.package-data]
"onramp" = [
  "config.toml",
  "static/logo.png",
  "templates/*"
]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "__pycache__/*"]
